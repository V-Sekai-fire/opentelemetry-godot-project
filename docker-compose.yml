services:
  # OpenTelemetry Collector — receives OTLP/HTTP on :4318, OTLP/gRPC on :4317
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  ← Godot sends here
      - "8888:8888"   # Prometheus metrics (collector self-monitoring)
      - "55679:55679" # zPages (http://localhost:55679/debug/tracez)
    depends_on:
      - jaeger

  # Jaeger — trace visualisation at http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC (collector → Jaeger)
      - "14268:14268" # HTTP
